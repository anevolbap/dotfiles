# Aerospace configuration for dual monitor setup

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'

[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

# Workspace to monitor assignments
# External: workspaces 1-2 (Emacs, Notion)
# Laptop: workspace 3 (Slack, Chrome)
[workspace-to-monitor-force-assignment]
1 = 'secondary'    # Emacs - External
2 = 'secondary'    # Notion - External
3 = 'built-in'     # Slack + Chrome - Laptop

[mode.main.binding]

# Focus windows (Alt-Shift + hjkl)
alt-shift-h = 'focus left'
alt-shift-j = 'focus down'
alt-shift-k = 'focus up'
alt-shift-l = 'focus right'

# Move windows (Alt-Shift-Ctrl + hjkl)
alt-shift-ctrl-h = 'move left'
alt-shift-ctrl-j = 'move down'
alt-shift-ctrl-k = 'move up'
alt-shift-ctrl-l = 'move right'

# Resize windows (Alt-Cmd + hjkl)
alt-cmd-h = 'resize width -50'
alt-cmd-l = 'resize width +50'
alt-cmd-k = 'resize height +50'
alt-cmd-j = 'resize height -50'

# Switch workspaces (Alt-Shift + number)
alt-shift-1 = 'workspace 1'  # Emacs
alt-shift-2 = 'workspace 2'  # Notion
alt-shift-3 = 'workspace 3'  # Slack + Chrome

# Move window to workspace (Alt-Shift-Cmd + number)
alt-shift-cmd-1 = 'move-node-to-workspace 1'
alt-shift-cmd-2 = 'move-node-to-workspace 2'
alt-shift-cmd-3 = 'move-node-to-workspace 3'

# Focus monitor directly
alt-shift-n = 'focus-monitor built-in'      # Focus laptop
alt-shift-m = 'focus-monitor secondary'     # Focus external

# Move window to monitor
alt-shift-ctrl-n = 'move-node-to-monitor built-in'
alt-shift-ctrl-m = 'move-node-to-monitor secondary'

# Layout management
alt-shift-f = 'fullscreen'
alt-shift-s = 'layout tiles horizontal vertical'
alt-shift-a = 'layout accordion horizontal vertical'

# Close focused window
alt-shift-c = 'close'

# Reload configuration
alt-shift-r = 'reload-config'

# Service mode
alt-shift-semicolon = 'mode service'

# Balance sizes
alt-shift-e = 'balance-sizes'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# App assignments to workspaces
[[on-window-detected]]
if.app-id = 'org.gnu.Emacs'
run = 'move-node-to-workspace 1'  # External

[[on-window-detected]]
if.app-id = 'notion.id'
run = 'move-node-to-workspace 1'  # External

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 1'  # Laptop

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 1'  # Laptop