# Emacs runs as a systemd user daemon, and agent-shell sessions live inside it,
# so the daemon failing to start takes every running agent with it.
#
# On 2026-08-23 an Elpaca build error for telega ("Non-existent source dir")
# aborted startup with status 255. The vendor unit sets Restart=on-failure, and
# the defaults are RestartSec=100ms with StartLimitBurst=5 inside
# StartLimitIntervalSec=10s, so all five retries happened in well under a second
# and systemd gave up for good:
#
#   emacs.service: Start request repeated too quickly.
#   emacs.service: Failed with result 'exit-code'.
#
# Nothing can change in half a second, so the retries were wasted. Space them out
# instead: ten attempts over five minutes.
#
# This still gives up eventually, on purpose. A permanently broken init.el should
# not respawn a heavy Emacs forever. Use StartLimitIntervalSec=0 to retry without
# limit.

[Unit]
StartLimitIntervalSec=1800
StartLimitBurst=10

[Service]
RestartSec=30
